name: check

# Правка справочника без новой подписи до клиентов не дойдёт: модуль отвергнет ленту целиком.
# Ловим это на PR, а не после мержа.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pynacl
      - run: python tools/sign.py --check
